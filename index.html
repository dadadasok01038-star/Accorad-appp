<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accorad CSN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">ACCORAD CSN</div>
            <div class="balance-card">
                <span id="balance">1000</span> 🪙
            </div>
        </header>

        <main class="main-screen">
            <div class="safe-box" id="openCaseBtn">
                <div class="safe-icon">🔐</div>
                <p>Открыть хранилище</p>
            </div>
            <div id="result" class="result-box">Нажмите на хранилище, чтобы начать!</div>
        </main>

        <nav class="nav-menu">
            <button class="nav-btn active">Кейсы</button>
            <button class="nav-btn" onclick="claimBonus()">Бонус</button>
        </nav>
    </div>
    <script src="script.js"></script>
</body>
</html>
